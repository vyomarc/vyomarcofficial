<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYOMARC Technologies | Stay Tuned</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0B0F19; /* Deep Premium Dark Blue */
            color: #F3F4F6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle Background Grid/Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 30%;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: 20%;
            z-index: 1;
        }

        /* Main Container */
        .container {
            text-align: center;
            padding: 2rem;
            z-index: 2;
            max-width: 600px;
        }

        /* Brand Logo/Name Style */
        .brand {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #3B82F6; /* Tech Blue */
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        /* Coming Soon Headline */
        .headline {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
            background: linear-gradient(135deg, #FFFFFF 0%, #9CA3AF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.3s forwards;
        }

        /* Stay Tuned Subheading */
        .subheading {
            font-size: 1.25rem;
            color: #9CA3AF;
            font-weight: 400;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.6s forwards;
        }

        /* Pulse Indicator Line */
        .status-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3B82F6, transparent);
            margin: 0 auto;
            position: relative;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.9s forwards;
        }

        .status-line::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #3B82F6;
            border-radius: 50%;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 12px #3B82F6;
            animation: pulse 2s infinite;
        }

        /* Animations */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .headline { font-size: 2.5rem; }
            .subheading { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">VYOMARC</div>
        <h1 class="headline">Coming Soon</h1>
        <p class="subheading">Stay tuned</p>
        <div class="status-line"></div>
    </div>

</body>
</html>
