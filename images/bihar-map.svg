<svg class="bihar-svg-map" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Abstract regional network map of Bihar">
                  <defs>
                    <linearGradient id="techGridGrad" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.8"/>
                      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.4"/>
                    </linearGradient>
                  </defs>

                  
                  <rect x="15" y="15" width="470" height="370" rx="16" fill="url(#techGridGrad)" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6 4"/>
                  
                  
                  <path d="M 25 35 L 25 25 L 35 25" fill="none" stroke="#0284c7" stroke-width="2"/>
                  <path d="M 465 25 L 475 25 L 475 35" fill="none" stroke="#0284c7" stroke-width="2"/>
                  <path d="M 25 365 L 25 375 L 35 375" fill="none" stroke="#0284c7" stroke-width="2"/>
                  <path d="M 465 375 L 475 375 L 475 365" fill="none" stroke="#0284c7" stroke-width="2"/>

                  
                  <line x1="15" y1="120" x2="485" y2="120" stroke="#e0f2fe" stroke-width="1" stroke-dasharray="3 3"/>
                  <line x1="15" y1="260" x2="485" y2="260" stroke="#e0f2fe" stroke-width="1" stroke-dasharray="3 3"/>
                  <line x1="160" y1="15" x2="160" y2="385" stroke="#e0f2fe" stroke-width="1" stroke-dasharray="3 3"/>
                  <line x1="330" y1="15" x2="330" y2="385" stroke="#e0f2fe" stroke-width="1" stroke-dasharray="3 3"/>

                  
                  <path class="map-river" d="M 20 185 Q 120 205 210 185 T 350 205 T 480 215" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 4" stroke-linecap="round"/>
                  <text x="350" y="180" font-size="9.5" font-weight="700" fill="#0284c7" letter-spacing="1.5" opacity="0.85">GANGA RIVER</text>

                  
                  <line x1="210" y1="100" x2="200" y2="195" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
                  <line x1="200" y1="195" x2="280" y2="255" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
                  <line x1="200" y1="195" x2="175" y2="335" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
                  <line x1="280" y1="255" x2="265" y2="295" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
                  <line x1="265" y1="295" x2="250" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
                  <line x1="250" y1="330" x2="175" y2="335" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
                  <line x1="280" y1="255" x2="405" y2="215" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
                  <line x1="200" y1="195" x2="405" y2="215" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>

                  
                  
                  <g class="map-node" transform="translate(210, 100)">
                    <circle class="node-pulse" r="14" fill="#fbbf24" fill-opacity="0.25"/>
                    <circle class="node-ring" r="8" fill="#fbbf24" fill-opacity="0.4"/>
                    <circle class="node-core" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
                    <text class="node-label" x="0" y="-14" text-anchor="middle">Muzaffarpur</text>
                  </g>

                  
                  <g class="map-node" transform="translate(200, 195)">
                    <circle class="node-pulse" r="14" fill="#fbbf24" fill-opacity="0.25"/>
                    <circle class="node-ring" r="8" fill="#fbbf24" fill-opacity="0.4"/>
                    <circle class="node-core" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
                    <text class="node-label" x="-14" y="4" text-anchor="end">Patna</text>
                  </g>

                  
                  <g class="map-node is-hq" transform="translate(280, 255)">
                    <circle class="node-pulse hq-pulse" r="16" fill="#0284c7" fill-opacity="0.3"/>
                    <circle class="node-ring hq-ring" r="9" fill="#0284c7" fill-opacity="0.45"/>
                    <circle class="node-core hq-core" r="5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
                    <text class="node-label hq-label" x="14" y="4" text-anchor="start">Bihar Sharif (HQ)</text>
                  </g>

                  
                  <g class="map-node" transform="translate(265, 295)">
                    <circle class="node-pulse" r="12" fill="#fbbf24" fill-opacity="0.25"/>
                    <circle class="node-ring" r="6.5" fill="#fbbf24" fill-opacity="0.4"/>
                    <circle class="node-core" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
                    <text class="node-label" x="12" y="4" text-anchor="start">Nalanda</text>
                  </g>

                  
                  <g class="map-node" transform="translate(250, 330)">
                    <circle class="node-pulse" r="12" fill="#fbbf24" fill-opacity="0.25"/>
                    <circle class="node-ring" r="6.5" fill="#fbbf24" fill-opacity="0.4"/>
                    <circle class="node-core" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
                    <text class="node-label" x="12" y="4" text-anchor="start">Rajgir</text>
                  </g>

                  
                  <g class="map-node" transform="translate(175, 335)">
                    <circle class="node-pulse" r="14" fill="#fbbf24" fill-opacity="0.25"/>
                    <circle class="node-ring" r="8" fill="#fbbf24" fill-opacity="0.4"/>
                    <circle class="node-core" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
                    <text class="node-label" x="-14" y="4" text-anchor="end">Gaya</text>
                  </g>

                  
                  <g class="map-node" transform="translate(405, 215)">
                    <circle class="node-pulse" r="14" fill="#fbbf24" fill-opacity="0.25"/>
                    <circle class="node-ring" r="8" fill="#fbbf24" fill-opacity="0.4"/>
                    <circle class="node-core" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
                    <text class="node-label" x="14" y="4" text-anchor="start">Bhagalpur</text>
                  </g>
                </svg>